# CI-specific overrides for ephemeral GitHub Actions runners.
# Copied to ~/.gradle/gradle.properties by the CI workflows.

org.gradle.daemon=false
org.gradle.workers.max=3

# Sized for the public-repo ubuntu-latest runner (4 vCPU, 16GB):
# 5g Gradle + 3g Kotlin daemon, leaving the rest for the OS and forked tools.
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Xmx5g -Xms5g
kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=320m -XX:+HeapDumpOnOutOfMemoryError -Xmx3g -Xms3g

# Incremental compilation is useless on clean CI builds
kotlin.incremental=false
