name: Debug Build

on:
  push:
    branches: [main, staging, feat-twidgetbrief]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: twidget-test
          POSTGRES_DB: twidget-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      TWIDGET_TEST_POSTGRES_URL: postgres://postgres:twidget-test@localhost:5432/twidget-test
    defaults:
      run:
        working-directory: bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: bridge/.nvmrc
          cache: npm
          cache-dependency-path: bridge/package-lock.json

      - name: Install and verify bridge
        run: |
          npm ci
          npm run check
          npm test
          npm audit --omit=dev

  build:
    # Forked pull requests cannot receive the read:packages credential needed
    # by the Tribalfs registry. Never switch this to pull_request_target: that
    # would run untrusted contributor code with repository secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy "tools" package was removed from Google's repository.
          packages: platform-tools

      - name: Use CI Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Test and build debug APK and AAB
        env:
          LINT_DO_NOT_REUSE_UAST_ENV: "true"
          # oneui-design + SESL libs live on GitHub Packages, which requires
          # auth even for public packages (token needs read:packages).
          GH_PACKAGES_USER: ${{ secrets.GH_PACKAGES_USER }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          ./gradlew testGithubDebugUnitTest compileGithubDebugAndroidTestKotlin assembleGithubDebug bundleGithubDebug lintGithubDebug --no-daemon --stacktrace
          jarsigner \
            -keystore app/debug.keystore \
            -storepass android \
            -keypass android \
            app/build/outputs/bundle/githubDebug/app-github-debug.aab \
            androiddebugkey

      - name: Verify signed debug APK and AAB
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Unable to locate apksigner in the Android SDK"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/github/debug/app-github-debug.apk
          APK_CERT=$("$APKSIGNER" verify --print-certs-pem app/build/outputs/apk/github/debug/app-github-debug.apk \
            | sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' \
            | openssl x509 -outform DER \
            | openssl dgst -sha256 -r \
            | awk '{print $1}')
          AAB_SIGNATURE=$(zipinfo -1 app/build/outputs/bundle/githubDebug/app-github-debug.aab \
            | sed -n -E '/^META-INF\/.*\.(RSA|DSA|EC)$/ {p;q;}')
          AAB_CERT=$(unzip -p app/build/outputs/bundle/githubDebug/app-github-debug.aab "$AAB_SIGNATURE" \
            | openssl pkcs7 -inform DER -print_certs \
            | openssl x509 -outform DER \
            | openssl dgst -sha256 -r \
            | awk '{print $1}')
          if ! jarsigner -verify app/build/outputs/bundle/githubDebug/app-github-debug.aab >/dev/null 2>&1; then
            echo "::error::Debug AAB signature verification failed"
            exit 1
          fi
          if [ -z "$APK_CERT" ] || [ -z "$AAB_SIGNATURE" ] || [ -z "$AAB_CERT" ] \
            || [ "$APK_CERT" != "$AAB_CERT" ]; then
            echo "::error::Debug AAB is unsigned or does not match the APK signing certificate"
            exit 1
          fi
          echo "Debug APK and AAB certificate SHA-256: $APK_CERT"

      - name: Read debug version
        id: version
        run: |
          VERSION=$(jq -r '.elements[0].versionName' app/build/outputs/apk/github/debug/output-metadata.json)
          BASE=$(sed -n 's/^versionName=\(.*\)$/\1/p' version.properties)
          CODE=$(jq -r '.elements[0].versionCode' app/build/outputs/apk/github/debug/output-metadata.json)
          SUFFIX="${VERSION#"$BASE"}"
          if ! [[ "$SUFFIX" =~ ^-dev\.[0-9]{8}\.[0-9]{4}$ ]] || [ "$CODE" != "100300198" ]; then
            echo "::error::Debug version must use $BASE-dev.YYYYMMDD.HHmm with fixed code 100300198; got $VERSION ($CODE)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stage debug APK and AAB
        run: |
          mkdir -p debug-artifacts
          cp app/build/outputs/apk/github/debug/app-github-debug.apk debug-artifacts/
          cp app/build/outputs/bundle/githubDebug/app-github-debug.aab debug-artifacts/

      - name: Upload debug APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: twidget-v${{ steps.version.outputs.version }}
          path: debug-artifacts/
          if-no-files-found: error

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-githubDebug.html
          if-no-files-found: ignore

  device:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        distribution: [github, play]
    env:
      LINT_DO_NOT_REUSE_UAST_ENV: "true"
      GH_PACKAGES_USER: ${{ secrets.GH_PACKAGES_USER }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Storage, rendering and minified compatibility checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            ./gradlew connected${{ matrix.distribution == 'github' && 'Github' || 'Play' }}DebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.tjg.twidget.data.AccountMutationInstrumentedTest,com.tjg.twidget.schedule.ScheduleTransactionsInstrumentedTest,com.tjg.twidget.schedule.ComposerRetirementInstrumentedTest,com.tjg.twidget.main.DashboardCardRenderingInstrumentedTest,com.tjg.twidget.main.DashboardSnapshotInstrumentedTest,com.tjg.twidget.ui.ImageCacheInstrumentedTest,com.tjg.twidget.ui.FontAssetEquivalenceInstrumentedTest,com.tjg.twidget.widget.WidgetStylesInstrumentedTest,com.tjg.twidget.followers.TopFollowersSearchInstrumentedTest --no-daemon
            ./gradlew connected${{ matrix.distribution == 'github' && 'Github' || 'Play' }}AuditAndroidTest -PauditTestBuildType=audit --no-daemon --max-workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-reports-${{ matrix.distribution }}
          path: app/build/reports/androidTests/
