name: Pre-release

on:
  workflow_dispatch:

permissions:
  contents: write # create the tag and the GitHub Release

jobs:
  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: bridge/.nvmrc
          cache: npm
          cache-dependency-path: bridge/package-lock.json

      - name: Install and verify bridge
        run: |
          npm ci
          npm run check
          npm test
          npm audit --omit=dev

  prerelease:
    needs: bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the changelog diff has a baseline

      - name: Validate release metadata
        run: |
          VERSION=$(sed -n 's/^versionName=\(.*\)$/\1/p' version.properties)
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version.properties must contain a plain semantic version."
            exit 1
          fi
          BRIDGE_VERSION=$(jq -r '.version' bridge/package.json)
          BRIDGE_LOCK_VERSION=$(jq -r '.packages[""].version' bridge/package-lock.json)
          if [ "$BRIDGE_VERSION" != "$VERSION" ] || [ "$BRIDGE_LOCK_VERSION" != "$VERSION" ]; then
            echo "::error::Bridge package metadata ($BRIDGE_VERSION / $BRIDGE_LOCK_VERSION) does not match beta base version $VERSION"
            exit 1
          fi
          if ! grep -Fq "## [$VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for [$VERSION]."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Resolve beta number
        id: beta
        run: |
          BASE=$(sed -n 's/^versionName=\(.*\)$/\1/p' version.properties)
          PREFIX="twidget-v${BASE}-beta."
          CURRENT=$(git tag --points-at HEAD --list "${PREFIX}*" \
            | sed -n "s/^${PREFIX}\([1-9][0-9]*\)$/\1/p" \
            | sort -n | tail -1)
          if [ -n "$CURRENT" ]; then
            NUMBER=$CURRENT
          else
            LAST=$(git tag --list "${PREFIX}*" \
              | sed -n "s/^${PREFIX}\([1-9][0-9]*\)$/\1/p" \
              | sort -n | tail -1)
            NUMBER=$((${LAST:-0} + 1))
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build signed beta APK and AAB
        env:
          GH_PACKAGES_USER: ${{ secrets.GH_PACKAGES_USER }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          BUFFER_OAUTH_CLIENT_ID: ${{ vars.BUFFER_OAUTH_CLIENT_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ vars.CLOUDINARY_UPLOAD_PRESET }}
        run: |
          ./gradlew testBetaUnitTest assembleBeta bundleBeta lintVitalBeta \
            -PbetaNumber=${{ steps.beta.outputs.number }} --no-daemon --stacktrace

      - name: Verify signed beta APK and AAB
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Unable to locate apksigner in the Android SDK"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/beta/app-beta.apk
          APK_CERT=$("$APKSIGNER" verify --print-certs-pem app/build/outputs/apk/beta/app-beta.apk \
            | sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' \
            | openssl x509 -outform DER \
            | openssl dgst -sha256 -r \
            | awk '{print $1}')
          AAB_SIGNATURE=$(zipinfo -1 app/build/outputs/bundle/beta/app-beta.aab \
            | sed -n -E '/^META-INF\/.*\.(RSA|DSA|EC)$/ {p;q;}')
          AAB_CERT=$(unzip -p app/build/outputs/bundle/beta/app-beta.aab "$AAB_SIGNATURE" \
            | openssl pkcs7 -inform DER -print_certs \
            | openssl x509 -outform DER \
            | openssl dgst -sha256 -r \
            | awk '{print $1}')
          if ! jarsigner -verify app/build/outputs/bundle/beta/app-beta.aab >/dev/null 2>&1; then
            echo "::error::Beta AAB signature verification failed"
            exit 1
          fi
          if [ -z "$APK_CERT" ] || [ -z "$AAB_SIGNATURE" ] || [ -z "$AAB_CERT" ] \
            || [ "$APK_CERT" != "$AAB_CERT" ]; then
            echo "::error::Beta AAB is unsigned or does not match the APK signing certificate"
            exit 1
          fi
          echo "Beta APK and AAB certificate SHA-256: $APK_CERT"

      - name: Read and validate beta version
        id: version
        run: |
          VERSION=$(jq -r '.elements[0].versionName' app/build/outputs/apk/beta/output-metadata.json)
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-beta\.[1-9][0-9]*$'; then
            echo "::error::Built APK has invalid beta version $VERSION"
            exit 1
          fi
          EXPECTED="$(sed -n 's/^versionName=\(.*\)$/\1/p' version.properties)-beta.${{ steps.beta.outputs.number }}"
          if [ "$VERSION" != "$EXPECTED" ]; then
            echo "::error::Built APK version $VERSION does not match expected beta version $EXPECTED"
            exit 1
          fi
          TAG="twidget-v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_COMMIT=$(git rev-list -n 1 "$TAG")
            HEAD_COMMIT=$(git rev-parse HEAD)
            if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
              echo "::error::Tag $TAG already points to $TAG_COMMIT, not this beta commit $HEAD_COMMIT"
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create tag if missing
        run: |
          TAG="twidget-v${{ steps.version.outputs.version }}"
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Stage APK and AAB with version in filenames
        run: |
          cp app/build/outputs/apk/beta/app-beta.apk "twidget-v${{ steps.version.outputs.version }}.apk"
          cp app/build/outputs/bundle/beta/app-beta.aab "twidget-v${{ steps.version.outputs.version }}.aab"

      - name: Generate changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="twidget-v${{ steps.version.outputs.version }}"
          VERSION="${{ steps.version.outputs.version }}"
          # Hand-written notes from CHANGELOG.md, if a matching section exists.
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { capture = 1; next }
            capture && /^## \[/ { capture = 0 }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            # Pre-releases usually share the upcoming stable version's notes.
            BASE_VERSION="${VERSION%%-*}"
            awk -v version="$BASE_VERSION" '
              $0 ~ "^## \\[" version "\\]" { capture = 1; next }
              capture && /^## / { capture = 0 }
              capture { print }
            ' CHANGELOG.md > release-notes.md
          fi
          if ! grep -q '[^[:space:]]' release-notes.md; then
            # Until the stable section is prepared, publish Unreleased notes
            # instead of a bare comparison URL.
            awk '
              /^## Unreleased$/ { capture = 1; next }
              capture && /^## / { capture = 0 }
              capture { print }
            ' CHANGELOG.md > release-notes.md
          fi
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no notes for $VERSION."
            exit 1
          fi
          # Auto-generated commit/PR changelog since the previous release.
          printf '\n## Changes since the previous release\n\n' >> release-notes.md
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body >> release-notes.md

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="twidget-v$VERSION"
          APK="twidget-v$VERSION.apk"
          AAB="twidget-v$VERSION.aab"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --notes-file release-notes.md
            gh release upload "$TAG" "$APK" "$AAB" --clobber
          else
            gh release create "$TAG" "$APK" "$AAB" \
              --prerelease \
              --title "Twidget v$VERSION" \
              --notes-file release-notes.md
          fi

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          DISCORD_RELEASE_MENTION: ${{ vars.DISCORD_RELEASE_MENTION }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_CHANNEL: beta
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/twidget-v${{ steps.version.outputs.version }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_RELEASE_WEBHOOK_URL is not configured; skipping Discord notification."
            exit 0
          fi
          bash .github/scripts/notify-discord-release.sh
