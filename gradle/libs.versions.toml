[versions]
# SESL9 requires API 37 and ships Java 24 bytecode. AGP 9.3+ supports both.
# Kotlin support is built into AGP 9.
agp = "9.4.1"
androidxTestExtJunit = "1.2.1"
androidxTestRunner = "1.6.2"
androidxWork = "2.11.2"
junit = "4.13.2"
kotlinxCoroutines = "1.10.2"
lottie = "6.6.2"
mlkitGenaiPrompt = "1.0.0-beta4"
oneuiDesign = "0.9.13+oneui8"
oneuiIcons = "1.1.0"
orgJson = "20251224"

[libraries]
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "androidxWork" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
mlkit-genai-prompt = { module = "com.google.mlkit:genai-prompt", version.ref = "mlkitGenaiPrompt" }
oneui-design = { module = "io.github.tribalfs:oneui-design", version.ref = "oneuiDesign" }
oneui-icons = { module = "io.github.oneuiproject:icons", version.ref = "oneuiIcons" }
org-json = { module = "org.json:json", version.ref = "orgJson" }

# Pin the whole SESL9 family strictly. oneui-design and some SESL9 POMs still
# request SESL8, whose numerically higher versions would otherwise win resolution.
sesl-appcompat = { module = "sesl.androidx.appcompat:appcompat", version = { strictly = "1.8.0+1.0.38-sesl9+rev0" } }
sesl-coordinatorlayout = { module = "sesl.androidx.coordinatorlayout:coordinatorlayout", version = { strictly = "1.3.0+1.0.6-sesl9+rev0" } }
sesl-core = { module = "sesl.androidx.core:core", version = { strictly = "1.19.0+1.0.29-sesl9+rev0" } }
sesl-customview = { module = "sesl.androidx.customview:customview", version = { strictly = "1.2.0-rc01+1.0.1-sesl9+rev0" } }
sesl-drawerlayout = { module = "sesl.androidx.drawerlayout:drawerlayout", version = { strictly = "1.2.0+1.0.5-sesl9+rev0" } }
sesl-fragment = { module = "sesl.androidx.fragment:fragment", version = { strictly = "1.9.0+1.0.6-sesl9+rev0" } }
sesl-indexscroll = { module = "sesl.androidx.indexscroll:indexscroll", version = { strictly = "1.0.2+1.0.2-sesl9+rev0" } }
sesl-material = { module = "sesl.com.google.android.material:material", version = { strictly = "1.14.0+1.0.47-sesl9+rev0" } }
sesl-picker-app = { module = "sesl.androidx.picker:picker-app", version = { strictly = "1.0.17+1.0.17-sesl9+rev0" } }
sesl-picker-basic = { module = "sesl.androidx.picker:picker-basic", version = { strictly = "1.0.8+1.0.8-sesl9+rev0" } }
sesl-picker-color = { module = "sesl.androidx.picker:picker-color", version = { strictly = "1.0.8+1.0.8-sesl9+rev0" } }
sesl-preference = { module = "sesl.androidx.preference:preference", version = { strictly = "1.2.1+1.0.5-sesl9+rev0" } }
sesl-recyclerview = { module = "sesl.androidx.recyclerview:recyclerview", version = { strictly = "1.4.0+1.0.25-sesl9+rev0" } }
sesl-slidingpanelayout = { module = "sesl.androidx.slidingpanelayout:slidingpanelayout", version = { strictly = "1.2.0+1.0.2-sesl9+rev0" } }
sesl-swiperefreshlayout = { module = "sesl.androidx.swiperefreshlayout:swiperefreshlayout", version = { strictly = "1.2.0-alpha01+1.0.2-sesl9+rev0" } }
sesl-viewpager = { module = "sesl.androidx.viewpager:viewpager", version = { strictly = "1.1.0-beta01+1.0.1-sesl9+rev0" } }
sesl-viewpager2 = { module = "sesl.androidx.viewpager2:viewpager2", version = { strictly = "1.1.0+1.0.5-sesl9+rev0" } }

android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }

[bundles]
sesl9 = [
    "sesl-appcompat",
    "sesl-coordinatorlayout",
    "sesl-core",
    "sesl-customview",
    "sesl-drawerlayout",
    "sesl-fragment",
    "sesl-indexscroll",
    "sesl-material",
    "sesl-picker-app",
    "sesl-picker-basic",
    "sesl-picker-color",
    "sesl-preference",
    "sesl-recyclerview",
    "sesl-slidingpanelayout",
    "sesl-swiperefreshlayout",
    "sesl-viewpager",
    "sesl-viewpager2",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

twidget-android-application = { id = "twidget.android.application" }
